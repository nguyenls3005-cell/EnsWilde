name: Build IPA

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Downgrade project format for Xcode 15
        run: |
          FILE="EnsWilde.xcodeproj/project.pbxproj"
          echo "Before:"
          grep -n "objectVersion" "$FILE" || true
          perl -i -pe 's/objectVersion\s*=\s*\d+;/objectVersion = 63;/g' "$FILE"
          echo "After:"
          grep -n "objectVersion" "$FILE"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: List schemes
        run: xcodebuild -list -project EnsWilde.xcodeproj

      - name: Build IPA
        run: bash ./scripts/build-ipa.sh Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnsWilde
          path: build/EnsWilde.ipa
          if-no-files-found: error