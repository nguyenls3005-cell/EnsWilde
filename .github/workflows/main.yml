name: Build IPA

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: List schemes
        run: xcodebuild -list -project EnsWilde.xcodeproj

      - name: Build IPA
        run: bash ./scripts/build-ipa.sh Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnsWilde
          path: build/EnsWilde.ipa
          if-no-files-found: error