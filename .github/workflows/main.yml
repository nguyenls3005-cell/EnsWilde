name: Build IPA

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: List schemes
        run: xcodebuild -list -project EnsWilde.xcodeproj

      # The only supported build path.  It drives EnsWilde.xcodeproj
      # through xcodebuild and packages build/EnsWilde.ipa; the same script is
      # what the local workflow runs, so CI and the host cannot drift apart.
      #
      # Invoked via `bash` rather than as an executable so the checkout's file
      # mode (which iOS / the GitHub web editor cannot set to +x) is irrelevant.
      - name: Build IPA
        run: bash ./scripts/build-ipa.sh Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnsWilde
          path: build/EnsWilde.ipa
          if-no-files-found: error
