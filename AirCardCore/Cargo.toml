[package]
name = "airlift_ffi"
version = "0.1.0"
edition = "2021"
description = "C FFI shim for the iOS airlift exploit"

[lib]
name = "airlift_ffi"
crate-type = ["staticlib"]

[dependencies]
idevice = { git = "https://github.com/jkcoxson/idevice.git", rev = "7bd551c16c6dd2e058740d85a2d9399a51a776e9", default-features = false, features = [
  "aws-lc", "remote_pairing", "tunnel_tcp_stack", "rsd", "tcp", "xpc", "core_device_proxy", "afc", "pair", "usbmuxd", "syslog_relay", "installation_proxy",
] }
idevice-ffi = { path = "../vendor/idevice-ffi", features = ["full", "aws-lc"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "fs", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
libc = "0.2"

[patch."https://github.com/jkcoxson/idevice.git"]
idevice = { path = "../vendor/idevice" }

[profile.release]
opt-level = 3
lto = "thin"
